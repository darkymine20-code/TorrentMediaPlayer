name: Compile & Debug iOS Torrent Media Player

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-compile:
    runs-on: macos-15
    steps:
      - name: Checkout Code & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Cache CocoaPods / SPM Dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Compile Xcode Workspace (Simulator Build)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace iTorrent.xcworkspace \
            -scheme iTorrent \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify || xcodebuild build \
            -workspace iTorrent.xcworkspace \
            -scheme iTorrent \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA Build Artifact
        run: |
          mkdir -p build-output
          xcodebuild archive \
            -workspace iTorrent.xcworkspace \
            -scheme iTorrent \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build-output/TorrentMediaPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload Compiled Xcode Archive
        uses: actions/upload-artifact@v4
        with:
          name: TorrentMediaPlayer-Compiled-Archive
          path: build-output/TorrentMediaPlayer.xcarchive
