name: Compile & Debug iOS Torrent Media Player

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-compile:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Submodule Dependencies
        run: |
          rm -rf Submodules/LibTorrent-Swift Submodules/MVVMFoundation Submodules/GCDWebServer Submodules/SwiftVLC
          git clone --depth 1 https://github.com/XITRIX/LibTorrent-Swift.git Submodules/LibTorrent-Swift
          git clone --depth 1 https://github.com/XITRIX/MVVMFoundation.git Submodules/MVVMFoundation
          git clone --depth 1 https://github.com/XITRIX/GCDWebServer.git Submodules/GCDWebServer
          git clone --depth 1 https://github.com/XITRIX/SwiftVLC.git Submodules/SwiftVLC

      - name: Patch SwiftVLC Tools Version
        run: |
          sed -i '' 's/swift-tools-version: 6.3/swift-tools-version: 6.0/g' Submodules/SwiftVLC/Package.swift

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace iTorrent.xcworkspace \
            -scheme iTorrent

      - name: Compile Xcode Workspace
        run: |
          xcodebuild build \
            -workspace iTorrent.xcworkspace \
            -scheme iTorrent \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
